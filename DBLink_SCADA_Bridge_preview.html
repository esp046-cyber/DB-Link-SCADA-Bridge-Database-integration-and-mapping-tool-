<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DB-Link SCADA Bridge</title>
<meta name="description" content="Wonderware / AVEVA SQL integration toolkit: tag-to-column mapping, script generation, storage estimation and FAT/SAT docs.">
<meta name="theme-color" content="#0EA5E9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DB-Link SCADA">
<style>
/* DB-Link SCADA Bridge - ISA-101 inspired dark HMI theme */
:root{
  --bg:#0B0F19; --card:#111827; --bd:#1E293B; --bd2:#334155;
  --cy:#0EA5E9; --am:#F59E0B; --gn:#10B981; --rd:#EF4444;
  --tx:#E5E7EB; --mut:#94A3B8;
  --mono:"JetBrains Mono","Fira Code",ui-monospace,Consolas,monospace;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 var(--sans);-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top);min-height:100vh;padding-bottom:72px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h2{font-size:18px;margin:0 0 4px}
h3{font-size:14px;margin:0 0 8px;color:var(--cy);text-transform:uppercase;letter-spacing:.06em}
p.hint,.hint{color:var(--mut);font-size:12.5px;margin:2px 0 10px}
code,pre,textarea.code,.mono{font-family:var(--mono)}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;
  background:var(--card);border-bottom:1px solid var(--bd);padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:8px;font-weight:500;font-size:16px}
.brand b{color:var(--cy)}
.top-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-size:11px;font-weight:800;letter-spacing:.08em;padding:3px 9px;border-radius:999px;border:1px solid}
.badge.online{color:var(--gn);border-color:var(--gn);background:rgba(16,185,129,.1)}
.badge.offline{color:var(--am);border-color:var(--am);background:rgba(245,158,11,.1)}
.update-bar{background:var(--am);color:#111;padding:6px 14px;font-weight:600}

/* controls */
select,input,textarea{background:#0B1220;color:var(--tx);border:1px solid var(--bd2);border-radius:6px;padding:6px 8px;font:inherit;max-width:100%}
select:focus,input:focus,textarea:focus,.btn:focus-visible,button:focus-visible{outline:2px solid var(--cy);outline-offset:1px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--cy)}
.btn{background:#1B2638;color:var(--tx);border:1px solid var(--bd2);border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--cy)}
.btn.primary{background:var(--cy);border-color:var(--cy);color:#03131d}
.btn.danger{color:var(--rd)}
.btn.small{padding:4px 10px;font-size:12.5px}
.btn[hidden]{display:none}

/* nav */
.nav{display:flex;gap:4px;padding:8px 14px 0;overflow-x:auto;border-bottom:1px solid var(--bd);background:var(--bg)}
.nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);padding:10px 12px;cursor:pointer;font-weight:600;white-space:nowrap;font-family:inherit;font-size:13.5px}
.nav button span{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--bd);font-size:11px;margin-right:4px}
.nav button.active{color:var(--tx);border-bottom-color:var(--cy)}
.nav button.active span{background:var(--cy);color:#03131d}

main{padding:14px;max-width:1280px;margin:0 auto}
.module{display:none}
.module.active{display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:3px;min-width:140px;flex:1}
.field label{font-size:11.5px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.field input,.field select{width:100%}

/* table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:5px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}
th{color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td input,td select{width:100%;min-width:90px}
td.chk{text-align:center;width:60px}
tr.lvl-err td:first-child{box-shadow:inset 3px 0 var(--rd)}
tr.lvl-warn td:first-child{box-shadow:inset 3px 0 var(--am)}
tr.lvl-ok td:first-child{box-shadow:inset 3px 0 var(--gn)}
.issue{font-size:12px;padding:2px 0}
.issue.err{color:var(--rd)} .issue.warn{color:var(--am)} .issue.ok{color:var(--gn)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid}
.pill.err{color:var(--rd);border-color:var(--rd)} .pill.warn{color:var(--am);border-color:var(--am)} .pill.ok{color:var(--gn);border-color:var(--gn)}

/* code */
pre.codeblock{background:#070B14;border:1px solid var(--bd);border-radius:8px;padding:12px;overflow:auto;max-height:560px;margin:0;font-size:12.5px;line-height:1.5;tab-size:2;white-space:pre}
.tk-k{color:#38BDF8;font-weight:600} .tk-s{color:#86EFAC} .tk-c{color:#64748B;font-style:italic} .tk-n{color:#FBBF24}
textarea.code{width:100%;min-height:130px;font-size:12.5px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{background:var(--bd);border:1px solid var(--bd2);color:var(--mut);padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-family:inherit}
.tabs button.active{background:var(--cy);color:#03131d;border-color:var(--cy)}
.alert{border-left:4px solid var(--am);background:rgba(245,158,11,.08);padding:8px 12px;border-radius:4px;font-size:12.5px;margin:8px 0}
.alert.err{border-color:var(--rd);background:rgba(239,68,68,.08)}
.alert.ok{border-color:var(--gn);background:rgba(16,185,129,.08)}

/* stats */
.stat{background:#0B1220;border:1px solid var(--bd);border-radius:8px;padding:10px}
.stat .v{font:700 20px var(--mono);color:var(--cy)}
.stat .l{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}

/* sim */
.live{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.live .tagbox{background:#0B1220;border:1px solid var(--bd);border-radius:8px;padding:8px}
.live .tagbox .n{font:12px var(--mono);color:var(--mut)}
.live .tagbox .val{font:700 18px var(--mono)}
.led{display:inline-block;width:12px;height:12px;border-radius:50%;background:#374151;margin-right:6px;vertical-align:middle}
.led.on{background:var(--gn);box-shadow:0 0 8px var(--gn)}
.checklist{list-style:none;padding:0;margin:0}
.checklist li{padding:8px 0;border-bottom:1px solid var(--bd)}
.checklist label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.checklist b{color:var(--am)}

/* icons */
.icon-grid{display:flex;gap:10px;flex-wrap:wrap}
.icon-grid figure{margin:0;text-align:center;font-size:11px;color:var(--mut)}
.icon-grid canvas{background:repeating-conic-gradient(#1E293B 0 25%,#0B0F19 0 50%) 0 0/12px 12px;border-radius:8px;display:block;margin:0 auto 3px;max-width:96px;max-height:96px}

.toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);background:var(--cy);color:#03131d;font-weight:700;padding:8px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* mobile: bottom nav */
@media (max-width:720px){
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:30;border-top:1px solid var(--bd);border-bottom:0;background:var(--card);padding:0 4px env(safe-area-inset-bottom);justify-content:space-between}
  .nav button{flex:1;padding:10px 2px;font-size:11px;border-bottom:0;border-top:3px solid transparent;text-align:center}
  .nav button.active{border-top-color:var(--cy)}
  .nav button span{display:block;margin:0 auto 2px}
}

/* print: FAT/SAT report only */
@media print{
  body{background:#fff;color:#000;padding:0}
  .topbar,.nav,.toast,.update-bar,.no-print,.module:not(.active){display:none !important}
  .card{border:0;background:#fff;padding:0}
  #fatPreview{display:block !important;color:#000;font-size:11pt}
  #fatPreview table{border:1px solid #444}
  #fatPreview th,#fatPreview td{border:1px solid #444;color:#000}
}

</style>

<script>
/* DB-Link SCADA Bridge - engine: validator, parsers, code generators, estimators.
   Pure functions, no DOM access (testable in Node). */
(function (root) {
  'use strict';

  const TAG_TYPES = ['I/O Real', 'I/O Integer', 'I/O Discrete', 'Memory Message', 'ArchestrA Attribute'];
  const SQL_TYPES = ['FLOAT', 'INT', 'BIT', 'NVARCHAR(255)', 'DATETIME2'];
  const INTOUCH_LIMIT = 131; // max characters in an InTouch QuickScript string literal
  const INTOUCH_TAG_LIMIT = 32;

  /* ---------- helpers ---------- */
  const isIdent = (s) => /^[A-Za-z_][A-Za-z0-9_]*$/.test(s || '');
  const q = (s) => '[' + String(s).replace(/]/g, ']]') + ']';
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const csvCell = (v) => { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };

  /* ---------- type compatibility ---------- */
  // [level, message]; level: ok | warn | err
  const COMPAT = {
    'I/O Real': {
      FLOAT: ['ok', 'Real maps cleanly to FLOAT (8-byte IEEE 754).'],
      INT: ['warn', 'Real to INT truncates fractional values; scaling or rounding is lost.'],
      BIT: ['err', 'Real cannot map to BIT: analog values collapse to 0/1. Use FLOAT or a discrete tag.'],
      'NVARCHAR(255)': ['warn', 'Real stored as text: breaks numeric aggregation and range indexes. Prefer FLOAT.'],
      DATETIME2: ['err', 'Real cannot map to DATETIME2.']
    },
    'I/O Integer': {
      FLOAT: ['warn', 'Integer widened to FLOAT: valid but wastes space and risks precision on large counters.'],
      INT: ['ok', 'Integer maps cleanly to INT (32-bit).'],
      BIT: ['warn', 'Integer to BIT loses all values except 0/non-zero.'],
      'NVARCHAR(255)': ['warn', 'Integer stored as text: no numeric indexing; use INT.'],
      DATETIME2: ['err', 'Integer cannot map to DATETIME2.']
    },
    'I/O Discrete': {
      FLOAT: ['warn', 'Discrete stored as FLOAT: use BIT.'],
      INT: ['warn', 'Discrete stored as INT: acceptable, but BIT is smaller and clearer.'],
      BIT: ['ok', 'Discrete maps cleanly to BIT.'],
      'NVARCHAR(255)': ['warn', 'Discrete stored as text: use BIT.'],
      DATETIME2: ['err', 'Discrete cannot map to DATETIME2.']
    },
    'Memory Message': {
      FLOAT: ['err', 'Message (string) cannot map to FLOAT.'],
      INT: ['err', 'Message (string) cannot map to INT.'],
      BIT: ['err', 'Message (string) cannot map to BIT.'],
      'NVARCHAR(255)': ['ok', 'Message maps to NVARCHAR(255). InTouch message tags are limited to 131 characters.'],
      DATETIME2: ['warn', 'Message to DATETIME2 requires a parseable date string; conversion errors likely.']
    },
    'ArchestrA Attribute': {
      FLOAT: ['warn', 'Confirm the attribute is Float/Double in the IDE; numeric attributes of other types will cast.'],
      INT: ['warn', 'Confirm the attribute is Integer in the IDE.'],
      BIT: ['warn', 'Confirm the attribute is Boolean in the IDE.'],
      'NVARCHAR(255)': ['ok', 'String attributes map to NVARCHAR(255).'],
      DATETIME2: ['ok', 'Time attributes map to DATETIME2 (use UTC to avoid DST gaps).']
    }
  };

  function validateRow(m, all) {
    const issues = [];
    const c = (COMPAT[m.tagType] || {})[m.sqlType];
    if (c) issues.push({ level: c[0], msg: c[1] });
    else issues.push({ level: 'err', msg: 'Unknown tag or SQL type combination.' });
    if (!m.tag) issues.push({ level: 'err', msg: 'Tagname is empty.' });
    if (!isIdent(m.col)) issues.push({ level: 'err', msg: 'Column name must be a valid identifier (letters, digits, underscore; no leading digit).' });
    if (m.tag && m.tag.length > INTOUCH_TAG_LIMIT && /^I\/O|^Memory/.test(m.tagType)) issues.push({ level: 'warn', msg: 'InTouch tagnames are limited to ' + INTOUCH_TAG_LIMIT + ' characters.' });
    if (m.pk && m.nullable) issues.push({ level: 'err', msg: 'A primary key column cannot be nullable.' });
    if (m.pk && /^NVARCHAR/.test(m.sqlType)) issues.push({ level: 'warn', msg: 'NVARCHAR primary key: wide, fragmenting clustered key. Prefer an IDENTITY surrogate plus a time index.' });
    if (m.pk && m.sqlType === 'FLOAT') issues.push({ level: 'warn', msg: 'FLOAT primary key: equality on floating point is unreliable.' });
    if (m.col && all.filter((x) => (x.col || '').toLowerCase() === m.col.toLowerCase()).length > 1) issues.push({ level: 'err', msg: 'Duplicate column name.' });
    if (m.tag && all.filter((x) => (x.tag || '').toLowerCase() === m.tag.toLowerCase()).length > 1) issues.push({ level: 'warn', msg: 'Tag is mapped more than once.' });
    return issues;
  }

  function validate(tags) {
    return tags.map((m) => {
      const issues = validateRow(m, tags);
      const level = issues.some((i) => i.level === 'err') ? 'err' : issues.some((i) => i.level === 'warn') ? 'warn' : 'ok';
      return { level, issues };
    });
  }

  /* ---------- CSV / JSON import-export ---------- */
  function parseCSVLine(line) {
    const out = []; let cur = ''; let inq = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (inq) {
        if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; }
        else if (ch === '"') inq = false;
        else cur += ch;
      } else if (ch === '"') inq = true;
      else if (ch === ',' || ch === '\t') { out.push(cur); cur = ''; }
      else cur += ch;
    }
    out.push(cur);
    return out.map((s) => s.trim());
  }

  function guessTagType(raw) {
    const s = (raw || '').toLowerCase();
    if (/discrete|bool|bit/.test(s)) return 'I/O Discrete';
    if (/real|float|double|analog/.test(s)) return 'I/O Real';
    if (/int|long|short|word/.test(s)) return 'I/O Integer';
    if (/message|string|text|msg/.test(s)) return 'Memory Message';
    if (/attr|archestra|\./.test(s)) return 'ArchestrA Attribute';
    return 'I/O Real';
  }
  const defaultSql = (tt) => ({ 'I/O Real': 'FLOAT', 'I/O Integer': 'INT', 'I/O Discrete': 'BIT', 'Memory Message': 'NVARCHAR(255)', 'ArchestrA Attribute': 'FLOAT' }[tt]);
  const toColumn = (tag) => { let c = String(tag).replace(/[^A-Za-z0-9_]/g, '_'); if (/^\d/.test(c)) c = 'T_' + c; return c; };

  /* Accepts the InTouch DBLoad/DBDump ":IOReal" style sections, or a plain CSV
     (Tagname, Type, [Column], [SqlType], [PK], [Nullable]) with optional header. */
  function parseTagCSV(text) {
    const rows = []; const errors = [];
    const lines = String(text || '').split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
    let section = null;
    lines.forEach((line, idx) => {
      const sec = line.match(/^:(\w+)/);
      if (sec) {
        const s = sec[1].toLowerCase();
        if (/^io(real|int|disc|msg)/.test(s) || /^mem(real|int|disc|msg)/.test(s)) {
          section = /real/.test(s) ? 'I/O Real' : /int/.test(s) ? 'I/O Integer' : /disc/.test(s) ? 'I/O Discrete' : 'Memory Message';
        } else section = null;
        return;
      }
      const cells = parseCSVLine(line);
      if (/^tag(name)?$/i.test(cells[0])) return; // header
      if (!cells[0]) { errors.push('Line ' + (idx + 1) + ': empty tagname.'); return; }
      let tagType; let rest;
      if (section) { tagType = section; rest = cells.slice(1); }
      else {
        tagType = TAG_TYPES.includes(cells[1]) ? cells[1] : guessTagType(cells[1]);
        rest = cells.slice(2);
      }
      const tag = cells[0];
      const col = rest[0] && isIdent(rest[0]) ? rest[0] : toColumn(tag);
      const sqlType = SQL_TYPES.includes(rest[1]) ? rest[1] : defaultSql(tagType);
      const truthy = (v) => /^(1|true|yes|y)$/i.test(v || '');
      rows.push({ tag, tagType, col, sqlType, pk: truthy(rest[2]), nullable: rest[3] === undefined || rest[3] === '' ? true : truthy(rest[3]) });
    });
    return { rows, errors };
  }

  function toCSV(tags) {
    const head = 'Tagname,TagType,Column,SqlType,PrimaryKey,Nullable';
    return [head].concat(tags.map((t) => [t.tag, t.tagType, t.col, t.sqlType, t.pk ? 1 : 0, t.nullable ? 1 : 0].map(csvCell).join(','))).join('\r\n');
  }

  /* ---------- 131-character chunker ---------- */
  const qsEscape = (s) => s.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
  // Split SQL into pieces whose escaped form fits in a QuickScript literal.
  function chunkSQL(sql, limit) {
    limit = limit || INTOUCH_LIMIT;
    const flat = String(sql).replace(/\s+/g, ' ').trim();
    const parts = []; let cur = '';
    // tokens keep trailing separators so pieces break on spaces/commas, never inside a word
    const tokens = flat.match(/[^ ,()]+[ ,()]*|[ ,()]+/g) || [];
    const fits = (s) => qsEscape(s).length <= limit;
    tokens.forEach((tok) => {
      if (fits(cur + tok)) { cur += tok; return; }
      if (cur) { parts.push(cur); cur = ''; }
      while (!fits(tok)) { // single token longer than limit: hard split
        let n = tok.length; while (n > 1 && !fits(tok.slice(0, n))) n--;
        parts.push(tok.slice(0, n)); tok = tok.slice(n);
      }
      cur = tok;
    });
    if (cur) parts.push(cur);
    return parts;
  }

  /* ---------- InTouch QuickScript ---------- */
  function tagExpr(m) {
    if (m.tagType === 'I/O Real' || m.tagType === 'ArchestrA Attribute' && m.sqlType === 'FLOAT') return 'StringFromReal(' + m.tag + ', 3, "f")';
    if (m.tagType === 'I/O Integer' || m.sqlType === 'INT') return 'StringFromIntg(' + m.tag + ', 10)';
    if (m.sqlType === 'BIT') return null; // handled with IF
    return null;
  }

  function genQuickScript(p) {

    L.push('');
    L.push('{ ---- 4. SQLSelect ----------------------------------------------------- }');

    L.push('IF SQLResult <> 0 THEN');
    L.push('  LogMessage("SQLSelect failed: " + SQLErrorMsg(SQLResult));');
    L.push('ELSE');
    L.push('  SQLFirst(SQLConn);');
    L.push('ENDIF;');
    L.push('');

    return L.join('\n');
  }

  /* ---------- ArchestrA C# ---------- */
  function genArchestra(p) {

    L.push('    {');

  function camel(s) { return String(s).charAt(0).toLowerCase() + String(s).slice(1); }
  function csType(m) { return { FLOAT: 'double', INT: 'int', BIT: 'bool', 'NVARCHAR(255)': 'string', DATETIME2: 'DateTime' }[m.sqlType] || 'object'; }
  function sqlDbType(t) { return { FLOAT: 'Float', INT: 'Int', BIT: 'Bit', 'NVARCHAR(255)': 'NVarChar', DATETIME2: 'DateTime2' }[t] || 'Variant'; }

  /* ---------- SQL DDL / dialects ---------- */
  const DIALECT_TYPES = {
    mssql:    { FLOAT: 'FLOAT', INT: 'INT', BIT: 'BIT', 'NVARCHAR(255)': 'NVARCHAR(255)', DATETIME2: 'DATETIME2(3)' },

    oracle:   { FLOAT: 'BINARY_DOUBLE', INT: 'NUMBER(10)', BIT: 'NUMBER(1)', 'NVARCHAR(255)': 'NVARCHAR2(255)', DATETIME2: 'TIMESTAMP(3)' }
  };

  function genDDL(p, dialect) {
    dialect = dialect || 'mssql';

    const L = [];

      L.push(');');
      L.push('CREATE INDEX ix_' + t + '_LogTime ON ' + t + ' USING BRIN (LogTime);');

      tags.forEach((m, i) => L.push('  ' + m.col + ' ' + T[m.sqlType] + (m.nullable ? '' : ' NOT NULL') + (i < tags.length - 1 ? ',' : '')));
      L.push(');');
      L.push('CREATE INDEX ix_' + t + '_LogTime ON ' + t + ' (LogTime);');
      return L.join('\n');
    }
    // SQL Server
    L.push('SET ANSI_NULLS ON; SET QUOTED_IDENTIFIER ON;');
    L.push('GO');
    L.push('CREATE TABLE dbo.' + t + ' (');
    L.push('  Id       BIGINT IDENTITY(1,1) NOT NULL,');

    L.push('  CONSTRAINT PK_' + t + ' PRIMARY KEY NONCLUSTERED (Id)');
    L.push(');');

    const keys = tags.filter((m) => m.pk && !m.nullable);
    keys.forEach((m) => L.push('CREATE NONCLUSTERED INDEX IX_' + t + '_' + m.col + ' ON dbo.' + t + ' (' + m.col + ', LogTime);'));
    L.push('GO');
    L.push('');
    L.push('-- Parameterised insert procedure');
    L.push('CREATE OR ALTER PROCEDURE dbo.usp_InsertScadaTelemetry');
    tags.forEach((m, i) => L.push('  @' + m.col + ' ' + T[m.sqlType] + ' = NULL' + (i < tags.length - 1 ? ',' : '')));
    L.push('AS');

    L.push('SELECT DateTime, TagName, Value, QualityDetail');

  /* ---------- storage estimator ---------- */
  function estimateStorage(o) {
    const tags = +o.tags || 0; const scanSec = Math.max(0.001, (+o.scan || 1) * (o.unit === 'ms' ? 0.001 : 1));
    const days = +o.days || 0; const rowBytes = +o.rowBytes || 46; const idx = 1 + (+o.indexPct || 30) / 100;
    const change = o.mode === 'delta' ? Math.min(1, Math.max(0, (+o.changePct || 15) / 100)) : 1;
    const rowsPerSec = (tags / scanSec) * change;
    const rowsDay = rowsPerSec * 86400;

/* DB-Link SCADA Bridge - Canvas icon pack generator (PNG exports, no dependencies). */
(function (root) {
  'use strict';

  const ICONS = [
    { name: 'icon-72.png', size: 72 }, { name: 'icon-96.png', size: 96 }, { name: 'icon-128.png', size: 128 },
    { name: 'icon-144.png', size: 144 }, { name: 'icon-152.png', size: 152 }, { name: 'icon-192.png', size: 192 },
    { name: 'icon-384.png', size: 384 }, { name: 'icon-512.png', size: 512 },
    { name: 'icon-maskable-192.png', size: 192, maskable: true }, { name: 'icon-maskable-512.png', size: 512, maskable: true },
    { name: 'apple-touch-icon.png', size: 180, opaque: true },
    { name: 'favicon-16x16.png', size: 16 }, { name: 'favicon-32x32.png', size: 32 }

  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  // Draws the SCADA -> DB emblem. Design grid is 512x512.
  function draw(ctx, size, opts) {
    opts = opts || {};
    const s = size / 512;
    ctx.clearRect(0, 0, size, size);
    ctx.save();
    ctx.scale(s, s);
    // background: maskable and opaque icons fill the full square (OS applies its own mask)
    ctx.fillStyle = '#0B0F19';
    if (opts.maskable || opts.opaque) ctx.fillRect(0, 0, 512, 512); else { rr(ctx, 0, 0, 512, 512, 96); ctx.fill(); }

      ctx.strokeStyle = '#1E293B'; ctx.lineWidth = 8; rr(ctx, 16, 16, 480, 480, 84); ctx.stroke();
    }
    // maskable safe zone is the inner 80%; shrink the emblem to ~70%
    if (opts.maskable) { ctx.translate(256, 256); ctx.scale(0.7, 0.7); ctx.translate(-256, -256); }

    // SCADA node
    ctx.fillStyle = '#111827'; ctx.strokeStyle = '#10B981'; ctx.lineWidth = 10;
    rr(ctx, 48, 196, 112, 120, 14); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(68, 280); ctx.lineTo(92, 244); ctx.lineTo(112, 268); ctx.lineTo(140, 220);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();

    ctx.strokeStyle = '#F59E0B'; ctx.lineWidth = 12; ctx.setLineDash([14, 12]);
    ctx.beginPath(); ctx.moveTo(160, 256); ctx.lineTo(244, 256); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#F59E0B'; ctx.beginPath(); ctx.moveTo(244, 236); ctx.lineTo(276, 256); ctx.lineTo(244, 276); ctx.closePath(); ctx.fill();

    // database cylinder
    ctx.fillStyle = 'rgba(14,165,233,0.18)';
    ctx.beginPath(); ctx.moveTo(264, 160); ctx.lineTo(264, 352); ctx.ellipse(346, 352, 82, 30, 0, Math.PI, 0, true); ctx.lineTo(428, 160); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#0EA5E9'; ctx.beginPath(); ctx.ellipse(346, 160, 82, 30, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#0EA5E9'; ctx.lineWidth = 12;
    ctx.beginPath(); ctx.moveTo(264, 160); ctx.lineTo(264, 352); ctx.ellipse(346, 352, 82, 30, 0, Math.PI, 0, true); ctx.lineTo(428, 160); ctx.stroke();
    ctx.lineWidth = 10;
    [224, 288].forEach((y) => { ctx.beginPath(); ctx.ellipse(346, y, 82, 30, 0, 0, Math.PI); ctx.stroke(); });
    ctx.restore();
  }

  function render(canvas, size, opts) {
    canvas.width = size; canvas.height = size;
    draw(canvas.getContext('2d'), size, opts);
    return canvas;
  }

  function toBlob(entry) {
    return new Promise((resolve) => {
      const c = document.createElement('canvas');
      render(c, entry.size, entry);
      c.toBlob((b) => resolve(b), 'image/png');

  }

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  async function downloadAll(onProgress) {
    for (let i = 0; i < ICONS.length; i++) {
      const blob = await toBlob(ICONS[i]);

      offset += lh.length + name.length + data.length;

    return new Blob(files.concat(central, [end]), { type: 'application/zip' });
  }

  function mdToHtml(md) {
    const lines = md.split('\n'); let out = ''; let i = 0;
    const inline = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    while (i < lines.length) {
      const l = lines[i];
      if (/^# /.test(l)) { out += '<h1 style="font-size:20px">' + inline(l.slice(2)) + '</h1>'; i++; }
      else if (/^## /.test(l)) { out += '<h2 style="margin-top:16px">' + inline(l.slice(3)) + '</h2>'; i++; }
      else if (/^\|/.test(l)) {
        const t = []; while (i < lines.length && /^\|/.test(lines[i])) { t.push(lines[i]); i++; }
        const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
        out += '<table style="margin:6px 0"><thead><tr>' + cells(t[0]).map((c) => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>' +
          t.slice(2).map((r) => '<tr>' + cells(r).map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
      } else if (/^- /.test(l)) {
        out += '<ul>'; while (i < lines.length && /^- /.test(lines[i])) { out += '<li>' + inline(lines[i].slice(2)) + '</li>'; i++; } out += '</ul>';
      } else if (l.trim() === '') i++;
      else { out += '<p style="margin:2px 0">' + inline(l) + '</p>'; i++; }
    }
    return out;
  }

    const doc = '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>' + esc(P.name) + ' - FDS</title><style>body{font:13px/1.5 Arial,sans-serif;margin:24px;color:#111}table{border-collapse:collapse;width:100%;margin:6px 0}th,td{border:1px solid #444;padding:4px 6px;text-align:left;vertical-align:top}th{background:#e5e7eb}code{font-family:Consolas,monospace}</style></head><body>' + html + '</body></html>';
    $('#fatMd').onclick = () => downloadText(slug(P.name) + '_FDS.md', md, 'text/markdown');
    $('#fatHtml').onclick = () => downloadText(slug(P.name) + '_FDS.html', doc, 'text/html');
    $('#fatPrint').onclick = () => window.print();

    const grid = $('#iconGrid');
    window.IconGenerator.ICONS.forEach((ic) => {
      const f = document.createElement('figure'); const c = document.createElement('canvas');
      window.IconGenerator.render(c, ic.size, ic);
      c.title = 'Click to download ' + ic.name; c.style.cursor = 'pointer';
      c.onclick = () => c.toBlob((b) => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = ic.name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); });
      f.appendChild(c); f.appendChild(document.createTextNode(ic.name + ' (' + ic.size + ')')); grid.appendChild(f);
    });
    $('#icoZip').onclick = async () => { await window.IconGenerator.downloadZip(); toast('ZIP downloaded'); };
    $('#icoAll').onclick = () => window.IconGenerator.downloadAll((n, t) => { $('#icoMsg').textContent = n + ' / ' + t; });
  }

  /* ================= navigation / project select ================= */
  const renderers = { mapper: renderMapper, conn: renderConn, code: renderCode, sim: renderSim, docs: renderDocs };
  let current = 'mapper';
  function show(mod) {
    current = mod;
    $$('.nav button').forEach((b) => b.classList.toggle('active', b.dataset.mod === mod));
    $$('.module').forEach((s) => s.classList.toggle('active', s.id === 'mod-' + mod));
    if (mod !== 'sim' && simTimer) { clearInterval(simTimer); simTimer = null; }
    renderers[mod]();
    window.scrollTo(0, 0);
  }
  function renderProjectSelect() {
    const s = $('#projectSelect');
    s.innerHTML = projects.map((p) => '<option value="' + attr(p.id) + '"' + (P && p.id === P.id ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('');
  }
  async function loadProjects(selectId) {
    projects = (await dbAll()) || [];
    projects.sort((a, b) => (a.created || 0) - (b.created || 0) || a.name.localeCompare(b.name));
    if (!projects.length) { const d = demoProject(); await dbPut(d); projects = [d]; }
    const want = selectId || (await metaGet('active'));
    P = projects.find((p) => p.id === want) || projects[0];
    await metaSet('active', P.id);
    simVals = {};
    renderProjectSelect(); show(current);
  }

  /* ================= PWA wiring ================= */
  function initPWA() {
    const badge = $('#netBadge');
    const upd = () => { const on = navigator.onLine; badge.textContent = on ? 'ONLINE' : 'OFFLINE READY'; badge.className = 'badge ' + (on ? 'online' : 'offline'); };
    window.addEventListener('online', upd); window.addEventListener('offline', upd); upd();

    let deferred = null; const btn = $('#installBtn');
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; btn.hidden = false; });
    btn.onclick = async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; btn.hidden = true; };
    window.addEventListener('appinstalled', () => { btn.hidden = true; toast('App installed'); });

    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) {
      navigator.serviceWorker.register('sw.js').then((reg) => {
        const prompt = (w) => { $('#updateBar').hidden = false; $('#updateBtn').onclick = () => w.postMessage({ type: 'SKIP_WAITING' }); };
        if (reg.waiting && navigator.serviceWorker.controller) prompt(reg.waiting);
        reg.addEventListener('updatefound', () => {
          const w = reg.installing; if (!w) return;
          w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) prompt(w); });
        });
      }).catch(() => {});
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloaded) return; reloaded = true; location.reload(); });
    }
  }

  /* ================= boot ================= */
  async function boot() {
    await openDB();
    initPWA();
    $$('.nav button').forEach((b) => b.addEventListener('click', () => show(b.dataset.mod)));
    $('#projectSelect').addEventListener('change', async (e) => { await metaSet('active', e.target.value); await loadProjects(e.target.value); });
    $('#newProjectBtn').addEventListener('click', async () => {
      const name = prompt('New project name:', 'NEW-PROJECT-01'); if (!name) return;
      const p = blankProject(name.trim()); p.created = Date.now(); await dbPut(p); await loadProjects(p.id); show('mapper'); toast('Project created');
    });
    const qp = new URLSearchParams(location.search); const m = qp.get('mod');
    if (m && renderers[m]) current = m;
    await loadProjects();
    if (qp.get('new') === '1') $('#newProjectBtn').click();
    if (location.hash === '#estimator') { const x = $('#estimator'); if (x) x.scrollIntoView(); }
  }
  boot();
})();

</script>

</body>
</html>
