<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DB-Link SCADA Bridge</title>
<meta name="description" content="Wonderware / AVEVA SQL integration toolkit: tag-to-column mapping, script generation, storage estimation and FAT/SAT docs.">
<meta name="theme-color" content="#0EA5E9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DB-Link SCADA">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><img src="favicon.svg" alt="" width="28" height="28"><span>DB-Link <b>SCADA Bridge</b></span></div>
  <div class="top-controls">
    <label class="sr-only" for="projectSelect">Active project</label>
    <select id="projectSelect" title="Active project"></select>
    <button class="btn small" id="newProjectBtn" title="New project">+ New</button>
    <span id="netBadge" class="badge online">ONLINE</span>
    <button class="btn primary small" id="installBtn" hidden>Install App</button>
  </div>
</header>
<div id="updateBar" class="update-bar" hidden>New version available. <button class="btn small" id="updateBtn">Reload</button></div>

<nav class="nav" id="nav">
  <button data-mod="mapper" class="active"><span>1</span> Bind List</button>
  <button data-mod="conn"><span>2</span> Connections</button>
  <button data-mod="code"><span>3</span> Code Gen</button>
  <button data-mod="sim"><span>4</span> Simulator</button>
  <button data-mod="docs"><span>5</span> FAT/SAT &amp; Icons</button>
</nav>

<main>
  <section id="mod-mapper" class="module active"></section>
  <section id="mod-conn" class="module"></section>
  <section id="mod-code" class="module"></section>
  <section id="mod-sim" class="module"></section>
  <section id="mod-docs" class="module"></section>
</main>
<div id="toast" class="toast" role="status"></div>

<script src="js/scada-engine.js"></script>
<script src="js/icon-generator.js"></script>
<script src="js/app.js"></script>
</body>
</html>
